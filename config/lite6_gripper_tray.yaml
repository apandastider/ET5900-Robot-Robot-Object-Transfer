/lite6/controller_manager:
  ros__parameters:
    lite_gripper_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/lite6/lite_gripper_traj_controller:
  ros__parameters:
    joints:
    - finger_joint1
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 25.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
    type: joint_trajectory_controller/JointTrajectoryController
